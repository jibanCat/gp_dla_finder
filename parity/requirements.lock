# Canonical parity environment lock — linux/amd64, CPython 3.10.
#
# Top-level AND transitive dependencies, pinned with hashes so the image build is
# reproducible and `--require-hashes` is satisfiable.
#
# Regenerated cross-platform (no Linux machine required) with:
#
#   pip download --only-binary=:all: --platform manylinux2014_x86_64 \
#       --python-version 310 --implementation cp --dest wheels numpy==X scipy==Y
#   pip download --only-binary=:all: --platform any --python-version 310 \
#       --implementation py --dest wheels pytest==Z
#   for w in wheels/*.whl; do pip hash "$w"; done
#
# Platform-specific wheels are marked; pure-Python wheels apply everywhere.
#
# h5py is present for the REFERENCE implementation's benefit, not this package's:
# gpy_dla_detection.generate_samples imports it at module scope, so the canonical
# image cannot run those comparison tests without it. gp_dla_finder itself keeps
# h5py as an optional extra.
