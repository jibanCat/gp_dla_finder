# Read the Docs configuration.
#
# This file defines the reproducible build for the public documentation at
# https://gp-dla-finder.readthedocs.io/en/latest/.
#
# Build locally with:  make -C docs html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  # Warnings are errors: a docs page that references a missing anchor or a
  # renamed symbol is wrong, not merely untidy.
  fail_on_warning: true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
