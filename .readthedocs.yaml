# Read the Docs configuration.
#
# PREPARED, NOT ACTIVATED. This file lets the docs build reproducibly and lets a
# future publication be a one-click decision rather than a scramble. It does NOT
# publish anything: no Read the Docs project is connected to this repository, and
# connecting one is a PI decision, not an engineering one.
#
# Build locally with:  make -C docs html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  # Warnings are errors: a docs page that references a missing anchor or a
  # renamed symbol is wrong, not merely untidy.
  fail_on_warning: true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
