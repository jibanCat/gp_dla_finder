# Promote the exact final-version distributions already built, published to,
# and smoke-tested on TestPyPI. This workflow never rebuilds them.
name: pypi

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: 'Exact final version, e.g. 0.1.0'
        required: true
        type: string
      expected_commit:
        description: 'Full 40-character commit SHA being promoted'
        required: true
        type: string
      testpypi_run_id:
        description: 'Successful release.yml run that published these bytes'
        required: true
        type: string
      confirm:
        description: 'Type "publish to pypi" to proceed'
        required: true
        type: string

permissions: {}

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

env:
  ARTIFACT_NAME: pypi-distributions

jobs:
  stage:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.files.outputs.version }}
      wheel: ${{ steps.files.outputs.wheel }}
      wheel_sha256: ${{ steps.files.outputs.wheel_sha256 }}
      sdist: ${{ steps.files.outputs.sdist }}
      sdist_sha256: ${{ steps.files.outputs.sdist_sha256 }}
    env:
      CONFIRM: ${{ inputs.confirm }}
      EXPECTED_VERSION: ${{ inputs.expected_version }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      TESTPYPI_RUN_ID: ${{ inputs.testpypi_run_id }}
      ACTUAL_COMMIT: ${{ github.sha }}
      ACTUAL_REF: ${{ github.ref }}
    steps:
      - name: Refuse an unconfirmed or ambiguous promotion
        run: |
          set -euo pipefail
          test "$CONFIRM" = "publish to pypi" || { echo "::error::confirmation phrase not given"; exit 1; }
          test "$ACTUAL_REF" = "refs/heads/main" || { echo "::error::production promotion is main-only"; exit 1; }
          case "$EXPECTED_COMMIT" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) echo "::error::expected_commit must be a full lowercase SHA"; exit 1 ;;
          esac
          test "$EXPECTED_COMMIT" = "$ACTUAL_COMMIT" || { echo "::error::dispatch commit differs from expected_commit"; exit 1; }
          case "$TESTPYPI_RUN_ID" in *[!0-9]*|'') echo "::error::testpypi_run_id must be numeric"; exit 1 ;; esac

      - name: The named TestPyPI run must be the successful source run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${TESTPYPI_RUN_ID}" > source-run.json
          jq -e --arg commit "$EXPECTED_COMMIT" '
            .name == "release" and
            .path == ".github/workflows/release.yml" and
            .event == "workflow_dispatch" and
            .status == "completed" and
            .conclusion == "success" and
            .head_branch == "main" and
            .head_sha == $commit
          ' source-run.json

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # 0 fetches tags, which the annotated-tag check below needs.
          # Nothing here talks to the remote afterwards -- `git cat-file` and
          # `git rev-parse` are local -- so the token does not need to stay in
          # .git/config while this job pip-installs and runs repository code.
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Validate the requested final version and its tag
        run: |
          set -euo pipefail
          python -m pip install 'packaging>=23,<27' 'tomli>=2.0,<3; python_version<"3.11"'
          python tools/check_release_version.py --expected "$EXPECTED_VERSION"
          EXPECTED_VERSION="$EXPECTED_VERSION" python - <<'PY'
          import os
          from packaging.version import Version
          version = Version(os.environ["EXPECTED_VERSION"])
          if version.is_prerelease or version.is_devrelease or version.local:
              raise SystemExit(f"production requires a final public version, got {version}")
          PY
          tag_type=$(git cat-file -t "refs/tags/v${EXPECTED_VERSION}")
          test "$tag_type" = "tag" || { echo "::error::v${EXPECTED_VERSION} must be an annotated tag"; exit 1; }
          tag_commit=$(git rev-parse "refs/tags/v${EXPECTED_VERSION}^{}")
          test "$tag_commit" = "$EXPECTED_COMMIT" || { echo "::error::release tag targets $tag_commit"; exit 1; }

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist/
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.testpypi_run_id }}

      - name: Verify and identify the exact promoted files
        id: files
        run: |
          set -euo pipefail
          test "$(find dist -mindepth 1 | wc -l)" -eq 3
          test -f dist/SHA256SUMS.txt
          cd dist
          sha256sum --check SHA256SUMS.txt
          wheel="gp_dla_finder-${EXPECTED_VERSION}-py3-none-any.whl"
          sdist="gp_dla_finder-${EXPECTED_VERSION}.tar.gz"
          test -f "$wheel"
          test -f "$sdist"
          test "$(find . -mindepth 1 -maxdepth 1 ! -name SHA256SUMS.txt ! -name "$wheel" ! -name "$sdist" | wc -l)" -eq 0
          cd ..
          python tools/check_release_version.py --expected "$EXPECTED_VERSION" --dist dist/
          python tools/check_release_shape.py dist/
          wheel_sha=$(sha256sum "dist/$wheel" | cut -d' ' -f1)
          sdist_sha=$(sha256sum "dist/$sdist" | cut -d' ' -f1)
          WHEEL="$wheel" SDIST="$sdist" WHEEL_SHA256="$wheel_sha" \
            SDIST_SHA256="$sdist_sha" python - <<'PY'
          import json, os, urllib.request

          version = os.environ["EXPECTED_VERSION"]
          wanted = {
              os.environ["WHEEL"]: os.environ["WHEEL_SHA256"],
              os.environ["SDIST"]: os.environ["SDIST_SHA256"],
          }
          with urllib.request.urlopen(
              f"https://test.pypi.org/pypi/gp-dla-finder/{version}/json",
              timeout=30,
          ) as response:
              data = json.load(response)
          published = {
              item["filename"]: item["digests"]["sha256"]
              for item in data["urls"]
          }
          if published != wanted:
              raise SystemExit(
                  f"TestPyPI files differ from the retained artifact: "
                  f"expected {wanted}, got {published}"
              )
          PY
          {
            echo "version=$EXPECTED_VERSION"
            echo "wheel=$wheel"
            echo "wheel_sha256=$wheel_sha"
            echo "sdist=$sdist"
            echo "sdist_sha256=$sdist_sha"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

  publish-pypi:
    needs: stage
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/gp_dla_finder
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/
      - name: The staged manifest must still match
        # `sha256sum --check` says every LISTED file is intact; it says nothing
        # about a file that is present and unlisted, and the next step hands
        # `dist/*` to twine. So the set is asserted too, in the one job that
        # cannot be un-run.
        run: |
          set -euo pipefail
          cd dist
          test "$(find . -mindepth 1 | wc -l)" -eq 3
          sha256sum --check SHA256SUMS.txt
          rm SHA256SUMS.txt
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  smoke-pypi:
    needs: [stage, publish-pypi]
    runs-on: ubuntu-latest
    permissions: {}
    env:
      VERSION: ${{ needs.stage.outputs.version }}
      WHEEL: ${{ needs.stage.outputs.wheel }}
      WHEEL_SHA256: ${{ needs.stage.outputs.wheel_sha256 }}
      SDIST: ${{ needs.stage.outputs.sdist }}
      SDIST_SHA256: ${{ needs.stage.outputs.sdist_sha256 }}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Fetch the exact files from production PyPI and compare hashes
        run: |
          set -euo pipefail
          mkdir pypi-files
          for attempt in 1 2 3 4 5 6; do
            if python - <<'PY'
          import json, os, pathlib, urllib.request
          version = os.environ["VERSION"]
          wanted = {os.environ["WHEEL"], os.environ["SDIST"]}
          with urllib.request.urlopen(
              f"https://pypi.org/pypi/gp-dla-finder/{version}/json", timeout=30
          ) as response:
              data = json.load(response)
          files = {item["filename"]: item["url"] for item in data["urls"]}
          if set(files) != wanted:
              raise SystemExit(f"expected {sorted(wanted)}, got {sorted(files)}")
          for name, url in files.items():
              with urllib.request.urlopen(url, timeout=60) as response:
                  pathlib.Path("pypi-files", name).write_bytes(response.read())
          PY
            then break; fi
            test "$attempt" = 6 && { echo "::error::version did not appear on PyPI"; exit 1; }
            rm -f pypi-files/*
            sleep 30
          done
          echo "${WHEEL_SHA256}  pypi-files/${WHEEL}" | sha256sum --check
          echo "${SDIST_SHA256}  pypi-files/${SDIST}" | sha256sum --check

      - name: Install the verified wheel and run one NumPy spectrum
        run: |
          set -euo pipefail
          python -m pip install --isolated --no-cache-dir --index-url https://pypi.org/simple/ "pypi-files/${WHEEL}"
          python - <<'PY'
          import os
          import numpy as np
          from gp_dla_finder import Config, __version__
          from gp_dla_finder.finder import Finder
          from gp_dla_finder.gp.spectrum import Spectrum
          assert __version__ == os.environ["VERSION"]
          finder = Finder(Config.desi_y3_fast(max_absorbers=1, enable_tau_eb=False), warn_about_threads=False)
          wave = np.arange(3600.0, 5600.0, 0.8)
          rng = np.random.default_rng(1)
          spectrum = Spectrum(wavelength=wave, flux=1.0 + rng.normal(0.0, 0.2, wave.size), ivar=np.full_like(wave, 25.0), z_qso=2.6, mask=np.zeros_like(wave, dtype=bool))
          result = finder.run(spectrum, targetid=1)
          assert result.status == "completed", result.reason
          assert result.provenance["backend_backend"] == "numpy"
          PY
